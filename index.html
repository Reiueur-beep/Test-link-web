<!DOCTYPE html>
<html>
<head>
  <title>(Anggap Aja link Https://)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
    }

    /* Navigation bar */
    .navbar {
      background: #e1306c; 
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .navbar a:hover {
      text-decoration: underline;
    }

    .content {
      margin: 50px auto;
      max-width: 500px;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .content img {
      width: 100px;
      height: 100px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .content p {
      font-size: 18px;
      margin: 15px 0;
    }

    /* Tombol Instagram */
    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #e1306c;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #c13584;
    }

    /* Footer */
    .footer {
      background: #e1306c;
      color: white;
      padding: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <a href="#">HOME</a>
    <a href="#">ABOUT ME</a>
    <a href="#">CONTACT ME</a>
  </div>

  <!-- Konten utama -->
  <div class="content">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram Logo">
    <p>Mampir ke ig gwe woe!</p>
    <!-- Tombol dengan link Instagram -->
    <a class="btn" href="https://www.instagram.com/reiiuervav?igsh=MW9vbng2Zm42b3hvcQ=="target="_blank">
      Instagram Gwejh
    </a>
  </div>

  <!-- Footer -->
  <div class="footer">
    Website Ini Dibuat dengan males malesan hehe :3
  </div>

</body>
</html>
